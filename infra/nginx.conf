# ---------------------------------------------------------------------------
# nginx reverse proxy + load balancer — for a MilesWeb VPS / multi-instance or
# multi-box deployment of CalibiAI Score.
#
# Put this at /etc/nginx/conf.d/calibiai.conf (or sites-available + symlink).
#
# What it gives you (the pieces the shared Node plan can't):
#   1. Load balancing across MANY app instances/boxes (least_conn + keepalive).
#   2. TLS termination (add your cert paths).
#   3. Static asset caching (/_next/static, /public) so the app servers only
#      handle dynamic requests.
#   4. Request buffering + size limits (protects app routes from huge bodies).
#   5. A per-IP rate limit zone (whole-box limit, stronger than the in-app
#      per-worker limiter).
#   6. Health-aware routing: a node whose /api/health returns 503 is drained.
#
# On a single shared MilesWeb Node plan you do NOT need this file — PM2 cluster
# mode (ecosystem.config.cjs) already load-balances across cores on one box.
# This is the next step when you outgrow one machine.
# ---------------------------------------------------------------------------

# Per-IP rate limiting (leaky bucket). Keyed on $binary_remote_addr.
limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
# Global burst bucket for spikes.
limit_req_zone $server_name zone=perserver:10m rate=3000r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

# Your app instances. Add more `server` lines (other boxes) to scale out.
upstream calibiai_backend {
    least_conn;
    keepalive 64;

    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;

    # Second node (uncomment when you have one):
    # server 10.0.0.11:3000 max_fails=3 fail_timeout=30s;

    # Third node (uncomment when you have one):
    # server 10.0.0.12:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name assessment.calibiai.com;

    # Enforce limits before proxying.
    limit_req zone=perip burst=60 nodelay;
    limit_req zone=perserver burst=4000 nodelay;
    limit_conn connperip 20;

    # Static assets: send immutable/long cache headers so browsers and any CDN
    # in front cache them, and app servers only handle dynamic requests.
    # (If you add a `proxy_cache_path` at http{} level you can also enable
    # nginx's own disk cache with `proxy_cache <zone>;` here.)
    location /_next/static/ {
        proxy_pass http://calibiai_backend;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?|mp3|webm)$ {
        proxy_pass http://calibiai_backend;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://calibiai_backend;
        proxy_http_version 1.1;

        # Keepalive to backend + client (reuse connections under load).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Body limits (resume upload is 5MB; give headroom).
        client_max_body_size 6m;

        # Timeouts tuned for the assessment: don't let a hung LLM/proctoring
        # request pin an upstream connection.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;

        # Buffering: nginx absorbs slow clients so the Node worker isn't
        # blocked writing to a slow socket.
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # If a backend is down/draining, retry the next healthy node once.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Active health checks (nginx plus / nginx OSS with the check module):
    #   location = /internal-health {
    #       check_status 200; proxy_pass http://calibiai_backend/api/health;
    #   }
    # Without the check module, nginx passive health checks (max_fails above)
    # already drain a node that starts returning 503 from /api/health.
    location = /healthz {
        proxy_pass http://calibiai_backend/api/health;
        access_log off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

# TLS (uncomment + point at your certs):
# server {
#     listen 443 ssl http2;
#     server_name assessment.calibiai.com;
#     ssl_certificate     /etc/letsencrypt/live/assessment.calibiai.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/assessment.calibiai.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ... (same locations as above) ...
# }
